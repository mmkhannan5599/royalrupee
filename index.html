<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Rupee | M.M Kannan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #00131b;
    }

    body {
      overflow-x: hidden;
    }

    .desktop-image,
    .mobile-image {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    .mobile-image {
      display: none;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .desktop-image {
        display: none;
      }

      .mobile-image {
        display: block;
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <picture>
    <source media="(max-width: 768px)" srcset="royal-rupee-mobile.png">
    <img
      class="desktop-image"
      src="royal-rupee-hero.png"
      alt="Royal Rupee - Building Trust. Creating Value."
    >
  </picture>

</body>
</html>
